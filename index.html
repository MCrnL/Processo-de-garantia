<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist de Vistoria</title>
<meta name="description" content="Checklist de fotos para vistoria de inversor fotovoltaico, com exportação em ZIP.">
<meta name="theme-color" content="#EDF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1419" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vistoria">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: cabeçalho fixo com progresso, seções recolhíveis com uma linha por foto, barra fixa embaixo para gerar o ZIP.
   Pensado para uso em campo: alvos de toque grandes, contraste alto, sem fontes externas (funciona offline). */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#E2E9EF; --fg:#10202C; --muted:#4F6376; --line:#C6D2DC;
  --accent:#0A5C8F; --accent-fg:#FFFFFF; --ok:#14733F; --ok-bg:#D8F0E2; --danger:#B3261E;
  --radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C1419; --surface:#141F27; --surface-2:#1E2D38; --fg:#E7EEF3; --muted:#9AAEBD; --line:#2B3D4A;
    --accent:#5DB6EA; --accent-fg:#06202F; --ok:#5BD08F; --ok-bg:#12301F; --danger:#E5534B;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-row{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:8px}
.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gps{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.gps.ok{background:var(--ok-bg);color:var(--ok)}
.gps.off{color:var(--danger)}
.count{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar>div{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}
.bar.full>div{background:var(--ok)}
@media (prefers-reduced-motion:reduce){.bar>div{transition:none}}

main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}

details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:12px 0;overflow:hidden}
details.sec>summary{display:flex;align-items:center;gap:10px;min-height:54px;padding:12px 16px;font-weight:700;cursor:pointer;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 3px 2px;flex:none}
details.sec[open]>summary::after{transform:rotate(-135deg);margin-bottom:-3px}
.sname{flex:1;min-width:0}
.pill{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}

.panel{padding:4px 16px 16px;display:grid;gap:14px;border-top:1px solid var(--line)}
.panel:first-of-type{padding-top:16px}
.field>label,.field>.q{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
input[type=text],input[type=date],textarea{width:100%;min-height:46px;padding:10px 12px;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px}
textarea{min-height:84px;resize:vertical}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none}
.check{display:flex;align-items:center;gap:12px;min-height:46px;font-weight:600}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:var(--surface-2);border-radius:10px}
.seg button{min-height:42px;border:0;border-radius:8px;background:transparent;font-weight:600}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.25)}

.stepper{display:inline-grid;grid-template-columns:46px minmax(64px,auto) 46px;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stepper button{height:46px;border:0;background:var(--surface-2);font-size:22px;line-height:1}
.stepper output{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;padding:0 10px;white-space:nowrap}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rowline>span{font-weight:600}

.mppt{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.mppt>strong{font-size:15px}
.mppt .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.mppt input[type=text]{background:var(--surface)}
.mppt .stepper{background:var(--surface)}

.gtitle{padding:12px 16px 4px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
ul.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.gtitle+ul .item:first-child{border-top:0}
.thumb{position:relative;width:64px;height:64px;padding:0;border-radius:10px;border:2px dashed var(--line);background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.thumb svg{width:26px;height:26px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:disabled{cursor:default}
.item.done .thumb{border:2px solid var(--ok)}
.tick{position:absolute;right:3px;bottom:3px;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.tick svg{width:12px;height:12px;stroke-width:3}
.lbl{font-weight:600;line-height:1.3;margin-bottom:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.icon{padding:0;width:44px}
.val{display:flex;align-items:center;gap:8px;margin-top:10px}
.val span{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.val input{max-width:120px;min-height:40px;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums}
.val em{font-style:normal;font-weight:600;color:var(--muted)}

.linkbtn{display:block;margin:20px auto 0;min-height:44px;padding:0 16px;background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:600}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.cta{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.cta small{font-size:13px;font-weight:600;opacity:.85}
.cta:disabled{opacity:.6}

#sheet{position:fixed;inset:0;z-index:20;background:rgba(5,12,18,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-box{width:100%;max-width:520px;background:var(--surface);border-radius:18px 18px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet-box h2{margin:0;font-size:19px}
.sheet-box p{margin:0;color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.acts .btn{flex:1 1 120px}

#view{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center}
#view img{max-width:100%;max-height:100%;object-fit:contain}
#view .close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));min-height:44px;padding:0 16px;border:0;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;font-weight:700}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:15;max-width:calc(100% - 32px);padding:10px 16px;border-radius:99px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <h1>Vistoria de inversor</h1>
      <span class="gps" id="gps">GPS…</span>
      <button id="install" class="btn" hidden>Instalar</button>
      <span class="count" id="count">0/0</span>
    </div>
    <div class="bar" id="bar"><div id="barfill"></div></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="dock">
  <div class="wrap">
    <button class="cta" id="zipbtn" data-act="zip">Gerar ZIP <small id="zipsub"></small></button>
  </div>
</div>

<div id="sheet" hidden><div class="sheet-box" role="dialog" aria-modal="true"><h2></h2><div class="body"></div><div class="acts"></div></div></div>
<div id="view" hidden data-act="close-view"><img alt="Foto ampliada"><button class="close" type="button">Fechar</button></div>
<div id="toast" role="status" hidden></div>

<input id="camIn" type="file" accept="image/*" capture="environment" hidden>
<input id="galIn" type="file" accept="image/*" hidden>

<script src="jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
